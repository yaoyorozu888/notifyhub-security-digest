name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      DIGEST_BASE_URL: ${{ vars.DIGEST_BASE_URL }}
      ACS_EMAIL_CONNECTION_STRING: ${{ secrets.ACS_EMAIL_CONNECTION_STRING }}
      ACS_EMAIL_SENDER: ${{ secrets.ACS_EMAIL_SENDER }}
      ACS_EMAIL_TO: ${{ secrets.ACS_EMAIL_TO }}
      ACS_EMAIL_SUBJECT_PREFIX: ${{ vars.ACS_EMAIL_SUBJECT_PREFIX }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_MAX_TOKENS: ${{ vars.OPENAI_MAX_TOKENS }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_TEMPERATURE: ${{ vars.OPENAI_TEMPERATURE }}
      NOTIFYHUB_USER_AGENT: ${{ vars.NOTIFYHUB_USER_AGENT }}
      ACS_EMAIL_ENABLED: ${{ vars.ACS_EMAIL_ENABLED }}
      DOTENV_OVERRIDE: ${{ vars.DOTENV_OVERRIDE }}
      NOTIFYHUB_HTTP_TIMEOUT: ${{ vars.NOTIFYHUB_HTTP_TIMEOUT }}
      NOTIFYHUB_HTTP_RETRIES: ${{ vars.NOTIFYHUB_HTTP_RETRIES }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Debug OPENAI_MODEL
        run: |
          echo "OPENAI_MODEL=${OPENAI_MODEL}"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Generate digest site
        run: |
          notifyhub-digest run --out-dir site --sources sources.json
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GROUND_0436BEE00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          skip_app_build: true
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./site" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "." # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GROUND_0436BEE00 }}
          action: "close"
