name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check app artifacts (site/index.html)
        id: artifacts
        run: |
          set -euo pipefail
          if [[ -f "site/index.html" || -f "site/Index.html" ]]; then
            echo "has_default_file=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_default_file=false" >> "$GITHUB_OUTPUT"
            echo "No default file found in site/ (expected index.html). Skipping deploy."
          fi

      - name: Debug vars / secrets (safe)
        run: |
          set -euo pipefail
          echo "== Vars (name=value) =="
          echo "(none)"

          echo "== Secrets (names only) =="
          echo "AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GROUND_0436BEE00"

      - name: Deploy
        if: steps.artifacts.outputs.has_default_file == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GROUND_0436BEE00 }}
          action: "upload"
          skip_app_build: true
          app_location: "site"
          api_location: ""
          # Build output is the same folder for this repo (pre-rendered static files)
          app_artifact_location: "site"
