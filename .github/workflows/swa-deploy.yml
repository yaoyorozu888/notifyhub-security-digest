name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/swa-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install "."

      - name: Generate site
        env:
          DIGEST_BASE_URL: "https://www.notifyhub.site/digest"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          LOG_LEVEL: INFO
        run: |
          set -euo pipefail
          notifyhub-digest run --out-dir site --no-send-email

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "site"
          api_location: ""
          # Build output is the same folder for this repo (pre-rendered static files)
          app_artifact_location: "."
