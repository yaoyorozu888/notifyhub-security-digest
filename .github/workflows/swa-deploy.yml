name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/swa-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Debug vars / secrets (safe)
        run: |
          set -euo pipefail
          echo "== Vars (name=value) =="
          echo "(none)"

          echo "== Secrets (names only) =="
          echo "AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GROUND_0436BEE00"

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GROUND_0436BEE00 }}
          action: "upload"
          skip_app_build: true
          app_location: "site"
          api_location: ""
          # Build output is the same folder for this repo (pre-rendered static files)
          app_artifact_location: "site"
