name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/swa-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install "."

      - name: Generate site
        env:
          DIGEST_BASE_URL: ${{ vars.DIGEST_BASE_URL }}
          ACS_EMAIL_CONNECTION_STRING: ${{ secrets.ACS_EMAIL_CONNECTION_STRING }}
          ACS_EMAIL_SENDER: ${{ secrets.ACS_EMAIL_SENDER }}
          ACS_EMAIL_TO: ${{ secrets.ACS_EMAIL_TO }}
          ACS_EMAIL_SUBJECT_PREFIX: ${{ vars.ACS_EMAIL_SUBJECT_PREFIX }}
          ACS_EMAIL_ENABLED: ${{ vars.ACS_EMAIL_ENABLED }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_MAX_TOKENS: ${{ vars.OPENAI_MAX_TOKENS }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_TEMPERATURE: ${{ vars.OPENAI_TEMPERATURE }}
          NOTIFYHUB_USER_AGENT: ${{ vars.NOTIFYHUB_USER_AGENT }}
          DOTENV_OVERRIDE: ${{ vars.DOTENV_OVERRIDE }}
          NOTIFYHUB_HTTP_TIMEOUT: ${{ vars.NOTIFYHUB_HTTP_TIMEOUT }}
          NOTIFYHUB_HTTP_RETRIES: ${{ vars.NOTIFYHUB_HTTP_RETRIES }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
        run: |
          set -euo pipefail
          notifyhub-digest run --out-dir site --no-send-email

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GROUND_0436BEE00 }}
          action: "upload"
          app_location: "site"
          api_location: ""
          # Build output is the same folder for this repo (pre-rendered static files)
          app_artifact_location: "."
