name: Generate daily digest

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send email via ACS"
        required: false
        default: "true"
        type: choice
        options:
          - "false"
          - "true"
      backup_mode:
        description: "Blob backup mode"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "full"
          - "daily"
  schedule:
    # JST 06:05 == UTC 21:05 (previous day)
    - cron: "5 21 * * *"

permissions:
  contents: write

concurrency:
  group: digest-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install ".[acs]"

      - name: Compute run_at (JST)
        id: runat
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          jst = ZoneInfo('Asia/Tokyo')
          now = datetime.now(jst)
          run_at = now.replace(hour=6, minute=0, second=0, microsecond=0)
          day = run_at.date().isoformat()
          day_path = day.replace('-', '/')
          print(f"run_at={run_at.isoformat()}")
          print(f"day={day}")
          print(f"day_path={day_path}")
          with open("runat.env", "w", encoding="utf-8") as f:
              f.write(f"RUN_AT={run_at.isoformat()}\n")
              f.write(f"DAY={day}\n")
              f.write(f"DAY_PATH={day_path}\n")
          PY

          cat runat.env >> $GITHUB_OUTPUT

      - name: Debug vars / secrets (safe)
        env:
          # Publish URL
          DIGEST_BASE_URL: ${{ vars.DIGEST_BASE_URL }}

          # ACS Email (optional)
          ACS_EMAIL_CONNECTION_STRING: ${{ secrets.ACS_EMAIL_CONNECTION_STRING }}
          ACS_EMAIL_SENDER: ${{ secrets.ACS_EMAIL_SENDER }}
          ACS_EMAIL_TO: ${{ secrets.ACS_EMAIL_TO }}
          ACS_EMAIL_SUBJECT_PREFIX: ${{ vars.ACS_EMAIL_SUBJECT_PREFIX }}
          ACS_EMAIL_ENABLED: ${{ vars.ACS_EMAIL_ENABLED }}

          # OpenAI (optional)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_MAX_TOKENS: ${{ vars.OPENAI_MAX_TOKENS }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_TEMPERATURE: ${{ vars.OPENAI_TEMPERATURE }}

          # Grok / featured topics (optional)
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          GROK_MAX_TOKENS: ${{ vars.GROK_MAX_TOKENS }}
          GROK_TEMPERATURE: ${{ vars.GROK_TEMPERATURE }}
          FEATURED_TOPIC_COUNT: ${{ vars.FEATURED_TOPIC_COUNT }}
          FEATURED_TOPIC_CATEGORIES: ${{ vars.FEATURED_TOPIC_CATEGORIES }}

          # Logging / HTTP
          NOTIFYHUB_USER_AGENT: ${{ vars.NOTIFYHUB_USER_AGENT }}
          DOTENV_OVERRIDE: ${{ vars.DOTENV_OVERRIDE }}
          NOTIFYHUB_HTTP_TIMEOUT: ${{ vars.NOTIFYHUB_HTTP_TIMEOUT }}
          NOTIFYHUB_HTTP_RETRIES: ${{ vars.NOTIFYHUB_HTTP_RETRIES }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
        run: |
          set -euo pipefail
          source <(cat runat.env)

          echo "== Run context =="
          echo "RUN_AT=${RUN_AT-}"
          echo "DAY=${DAY-}"
          echo "event_name=${{ github.event_name }}"

          echo "== Vars (name=value) =="
          echo "DIGEST_BASE_URL=${DIGEST_BASE_URL-}"
          echo "ACS_EMAIL_SUBJECT_PREFIX=${ACS_EMAIL_SUBJECT_PREFIX-}"
          echo "ACS_EMAIL_ENABLED=${ACS_EMAIL_ENABLED-}"
          echo "OPENAI_MODEL=${OPENAI_MODEL-}"
          echo "OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS-}"
          echo "OPENAI_BASE_URL=${OPENAI_BASE_URL-}"
          echo "OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE-}"
          echo "GROK_MODEL=${GROK_MODEL-}"
          echo "GROK_MAX_TOKENS=${GROK_MAX_TOKENS-}"
          echo "GROK_TEMPERATURE=${GROK_TEMPERATURE-}"
          echo "FEATURED_TOPIC_COUNT=${FEATURED_TOPIC_COUNT-}"
          echo "FEATURED_TOPIC_CATEGORIES=${FEATURED_TOPIC_CATEGORIES-}"
          echo "NOTIFYHUB_USER_AGENT=${NOTIFYHUB_USER_AGENT-}"
          echo "DOTENV_OVERRIDE=${DOTENV_OVERRIDE-}"
          echo "NOTIFYHUB_HTTP_TIMEOUT=${NOTIFYHUB_HTTP_TIMEOUT-}"
          echo "NOTIFYHUB_HTTP_RETRIES=${NOTIFYHUB_HTTP_RETRIES-}"
          echo "LOG_LEVEL=${LOG_LEVEL-}"

          echo "== Secrets (names only) =="
          echo "ACS_EMAIL_CONNECTION_STRING"
          echo "ACS_EMAIL_SENDER"
          echo "ACS_EMAIL_TO"
          echo "OPENAI_API_KEY"
          echo "GROK_API_KEY"

      - name: Generate digest (optionally send email)
        env:
          # Publish URL
          DIGEST_BASE_URL: ${{ vars.DIGEST_BASE_URL }}

          # ACS Email (optional)
          ACS_EMAIL_CONNECTION_STRING: ${{ secrets.ACS_EMAIL_CONNECTION_STRING }}
          ACS_EMAIL_SENDER: ${{ secrets.ACS_EMAIL_SENDER }}
          ACS_EMAIL_TO: ${{ secrets.ACS_EMAIL_TO }}
          ACS_EMAIL_SUBJECT_PREFIX: ${{ vars.ACS_EMAIL_SUBJECT_PREFIX }}
          ACS_EMAIL_ENABLED: ${{ vars.ACS_EMAIL_ENABLED }}

          # OpenAI (optional)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_MAX_TOKENS: ${{ vars.OPENAI_MAX_TOKENS }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_TEMPERATURE: ${{ vars.OPENAI_TEMPERATURE }}

          # Grok / featured topics (optional)
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          GROK_MAX_TOKENS: ${{ vars.GROK_MAX_TOKENS }}
          GROK_TEMPERATURE: ${{ vars.GROK_TEMPERATURE }}
          FEATURED_TOPIC_COUNT: ${{ vars.FEATURED_TOPIC_COUNT }}
          FEATURED_TOPIC_CATEGORIES: ${{ vars.FEATURED_TOPIC_CATEGORIES }}

          # Logging / HTTP
          NOTIFYHUB_USER_AGENT: ${{ vars.NOTIFYHUB_USER_AGENT }}
          DOTENV_OVERRIDE: ${{ vars.DOTENV_OVERRIDE }}
          NOTIFYHUB_HTTP_TIMEOUT: ${{ vars.NOTIFYHUB_HTTP_TIMEOUT }}
          NOTIFYHUB_HTTP_RETRIES: ${{ vars.NOTIFYHUB_HTTP_RETRIES }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
        run: |
          set -euo pipefail
          source <(cat runat.env)

          # Scheduled run: follow ACS_EMAIL_ENABLED unless manually overridden.
          SEND_EMAIL=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SEND_EMAIL="${{ inputs.send_email }}"
          else
            SEND_EMAIL="${{ vars.ACS_EMAIL_ENABLED }}"
          fi
          case "${SEND_EMAIL,,}" in
            1|true|yes|on) SEND_EMAIL=true ;;
            *) SEND_EMAIL=false ;;
          esac

          EMAIL_FLAG="--no-send-email"
          if [[ "$SEND_EMAIL" == "true" ]]; then
            EMAIL_FLAG="--send-email"
          fi

          notifyhub-digest run \
            --out-dir site \
            --run-at "$RUN_AT" \
            $EMAIL_FLAG

      - name: Determine backup mode
        id: backupmode
        uses: azure/cli@v2
        env:
          WORKFLOW_BACKUP_MODE: ${{ inputs.backup_mode }}
        with:
          inlineScript: |
            set -euo pipefail
            container="digest-backups"
            az storage container create \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --name "$container" 1>/dev/null

            mode="${WORKFLOW_BACKUP_MODE:-auto}"
            if [[ -z "$mode" || "$mode" == "auto" ]]; then
              full_count=$(az storage blob list \
                --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
                --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
                --container-name "$container" \
                --prefix full/ \
                --num-results 1 \
                --query "length(@)" \
                --output tsv)
              if [[ "$full_count" == "0" ]]; then
                mode="full"
              else
                mode="daily"
              fi
            fi

            echo "container=$container" >> "$GITHUB_OUTPUT"
            echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Create backup archive
        id: backupartifact
        run: |
          set -euo pipefail
          source <(cat runat.env)
          python scripts/create_digest_backup.py \
            --site-dir site \
            --output-dir backup-artifacts \
            --mode "${{ steps.backupmode.outputs.mode }}" \
            --run-at "$RUN_AT" \
            --day "$DAY" \
            --commit-sha "${GITHUB_SHA}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload backup to Blob Storage
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            archive_name=$(basename "${{ steps.backupartifact.outputs.archive_path }}")
            manifest_name=$(basename "${{ steps.backupartifact.outputs.manifest_path }}")
            prefix="${{ steps.backupartifact.outputs.blob_prefix }}"
            container="${{ steps.backupmode.outputs.container }}"

            az storage blob upload \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --container-name "$container" \
              --name "$prefix/$archive_name" \
              --file "${{ steps.backupartifact.outputs.archive_path }}" \
              --overwrite true

            az storage blob upload \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --container-name "$container" \
              --name "$prefix/$manifest_name" \
              --file "${{ steps.backupartifact.outputs.manifest_path }}" \
              --overwrite true

      - name: Delete digests older than 90 days
        run: |
          set -euo pipefail
          source <(cat runat.env)
          python scripts/cleanup_old_digests.py \
            --site-dir site \
            --retain-days 90 \
            --run-at "$RUN_AT"

      - name: Generate Pagefind index
        run: |
          set -euo pipefail
          npx --yes pagefind --site site --output-path site/pagefind

      - name: Upload artifact (generated digest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.runat.outputs.DAY }}
          path: site/digest/${{ steps.runat.outputs.DAY_PATH }}/

      - name: Commit & push generated site
        run: |
          set -euo pipefail
          source <(cat runat.env)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A \
            site/index.html \
            site/calendar/index.html \
            site/digest \
            site/pagefind || true

          git add \
            site/digest/index.html \
            site/digest/latest/index.html \
            site/digest/"$DAY_PATH" || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(digest): publish $DAY"
          git push

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          skip_app_build: true
          app_location: "site"
          api_location: ""
          app_artifact_location: "site"
