<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{subject}}</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f7f9;color:#111;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;">
    <div style="max-width:760px;margin:0 auto;padding:24px;">
      <div style="background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
        <div style="padding:18px 20px;border-bottom:1px solid #e5e7eb;background:#0b1220;color:#fff;">
          <div style="font-size:18px;font-weight:700;">{{subject}}</div>
          <div style="font-size:12px;opacity:0.85;margin-top:6px;">対象期間(JST): {{window_from_jst}} ～ {{window_to_jst}}</div>
          <div style="font-size:12px;opacity:0.85;margin-top:2px;">生成時刻(JST): {{generated_at_jst}}</div>
        </div>

        <div style="padding:16px 20px;">
          <div style="font-size:13px;color:#374151;line-height:1.6;">
            Web版: <a href="{{digest_url}}" style="color:#2563eb;">{{digest_url}}</a>
          </div>

          <div style="margin-top:10px;font-size:14px;color:#111827;">
            件数: <strong>{{count_total}}</strong>
          </div>

          <div style="margin-top:14px;border-top:1px solid #e5e7eb;"></div>

          <div style="margin-top:14px;">
            {{items_html}}
          </div>

          <div style="margin-top:18px;border-top:1px solid #e5e7eb;"></div>
          <div style="margin-top:12px;font-size:12px;color:#6b7280;line-height:1.5;">
            ※ 本メールは自動生成です。リンク先の一次情報もご確認ください。
          </div>
        </div>
      </div>

      <div style="text-align:center;margin-top:14px;font-size:12px;color:#6b7280;">
        notifyhub.site
      </div>
    </div>
  </body>
</html>
