<!-- index.html  (例: /digest/YYYY-MM-DD/index.html) -->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>CSIRT 日次レポート</title>
  <style>
    :root{
      --bg:#0b1020; --panel:#0f1730; --panel2:#121c3a;
      --text:#e7ecff; --muted:#a9b4df; --line:#22305b;
      --accent:#7aa2ff; --good:#4ade80; --warn:#fbbf24; --bad:#fb7185;
      --chip:#1b2650; --shadow:0 10px 30px rgba(0,0,0,.35);
      --radius:18px;
      color-scheme: dark;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background: radial-gradient(1000px 700px at 20% -10%, rgba(122,162,255,.25), transparent 60%),
                  radial-gradient(900px 600px at 90% 10%, rgba(251,113,133,.12), transparent 55%),
                  var(--bg);
      color:var(--text);
    }
    a{color:inherit}
    .wrap{max-width:1100px; margin:0 auto; padding:28px 18px 42px}
    header{
      display:flex; gap:16px; align-items:flex-start; justify-content:space-between;
      margin-bottom:18px;
    }
    .title{
      display:flex; flex-direction:column; gap:6px;
    }
    .title h1{
      margin:0; font-size:22px; letter-spacing:.2px;
    }
    .subtitle{
      color:var(--muted); font-size:13px; line-height:1.5;
    }
    .metaRow{
      display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;
    }
    .chip{
      display:inline-flex; align-items:center; gap:8px;
      background:rgba(27,38,80,.75);
      border:1px solid rgba(34,48,91,.9);
      padding:7px 10px; border-radius:999px;
      font-size:12px; color:var(--muted);
      backdrop-filter: blur(10px);
    }
    .chip strong{color:var(--text); font-weight:650}
    .panel{
      background: linear-gradient(180deg, rgba(15,23,48,.9), rgba(15,23,48,.75));
      border:1px solid rgba(34,48,91,.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:visible;
    }
    .controls{
      display:grid;
      grid-template-columns: 1.4fr 0.6fr 0.6fr 0.6fr;
      gap:10px;
      padding:14px;
      background:rgba(18,28,58,.6);
      border-bottom:1px solid rgba(34,48,91,.9);
      overflow:visible;
    }
    @media (max-width: 980px){
      .controls{grid-template-columns: 1fr 1fr; }
    }
    .ctrl{
      display:flex; flex-direction:column; gap:6px;
      min-width:0;
    }
    .ctrl label{font-size:11px; color:var(--muted)}
    .labelRow{display:flex; align-items:center; justify-content:space-between; gap:6px}
    .help{
      position:relative;
      width:14px; height:14px;
      border-radius:50%;
      border:1px solid rgba(169,180,223,.5);
      color:rgba(169,180,223,.9);
      font-size:10px; line-height:12px;
      text-align:center;
      cursor:help;
      flex:0 0 auto;
      background:rgba(11,16,32,.5);
    }
    .help::after{content:"?";}
    .help::before{
      content:attr(data-tip);
      position:absolute;
      right:0;
      top:-8px;
      transform:translateY(-100%);
      background:#0b1220;
      color:#e7ecff;
      border:1px solid rgba(34,48,91,.9);
      border-radius:10px;
      padding:8px 10px;
      width:220px;
      max-width:260px;
      font-size:11px;
      line-height:1.5;
      opacity:0;
      pointer-events:none;
      box-shadow: var(--shadow);
      z-index:10;
    }
    .help:hover::before{opacity:1;}
    input[type="search"], select{
      width:100%;
      padding:10px 11px;
      border-radius:12px;
      border:1px solid rgba(34,48,91,.9);
      background:rgba(11,16,32,.65);
      color:var(--text);
      outline:none;
    }
    input[type="search"]::placeholder{color:rgba(169,180,223,.7)}
    .summaryBar{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 14px;
      border-bottom:1px solid rgba(34,48,91,.9);
      color:var(--muted);
      font-size:12px;
    }
    .summaryBar .right{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }
    .btn{
      appearance:none; border:1px solid rgba(34,48,91,.9);
      background:rgba(11,16,32,.55);
      color:var(--text);
      padding:8px 10px;
      border-radius:12px;
      font-size:12px;
      cursor:pointer;
    }
    .btn:hover{border-color:rgba(122,162,255,.65)}
    .list{
      padding:12px;
      display:flex; flex-direction:column; gap:10px;
    }
    .card{
      background: linear-gradient(180deg, rgba(18,28,58,.75), rgba(15,23,48,.6));
      border:1px solid rgba(34,48,91,.9);
      border-radius:16px;
      padding:12px 12px 10px;
      display:flex; gap:12px;
      align-items:flex-start;
    }
    .badgeCol{
      min-width:122px;
      display:flex;
      flex-direction:column;
      gap:8px;
      padding-top:2px;
    }
    .tagRow{display:flex; gap:8px; flex-wrap:wrap}
    .tag{
      font-size:11px;
      padding:6px 9px;
      border-radius:999px;
      background:rgba(27,38,80,.65);
      border:1px solid rgba(34,48,91,.9);
      color:var(--muted);
      white-space:nowrap;
    }
    .tag.level-Critical{border-color:rgba(251,113,133,.65); color:#ffd0d7}
    .tag.level-High{border-color:rgba(251,191,36,.65); color:#ffe9b0}
    .tag.level-Medium{border-color:rgba(122,162,255,.65); color:#dbe6ff}
    .tag.level-Low{border-color:rgba(74,222,128,.55); color:#d0ffe2}
    .tag.level-Info{border-color:rgba(169,180,223,.55); color:rgba(169,180,223,.95)}
    .content{min-width:0; flex:1}
    .content h3{
      margin:0;
      font-size:15px;
      line-height:1.35;
      letter-spacing:.15px;
    }
    .content h3 a{
      text-decoration:none;
    }
    .content h3 a:hover{color:var(--accent)}
    .meta{
      margin-top:6px;
      display:flex; gap:10px; flex-wrap:wrap;
      color:var(--muted);
      font-size:12px;
    }
    .summary{
      margin-top:8px;
      color:rgba(231,236,255,.92);
      font-size:12px;
      line-height:1.7;
      background:rgba(12,18,38,.45);
      border:1px solid rgba(34,48,91,.7);
      border-radius:12px;
      padding:8px 10px;
    }
    .meta a{color:var(--muted)}
    .meta a:hover{color:var(--accent)}
    .actions{
      margin-top:10px;
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .linkbtn{
      text-decoration:none;
      display:inline-flex; align-items:center; justify-content:center;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(34,48,91,.9);
      background:rgba(11,16,32,.55);
      font-size:12px;
      color:var(--text);
    }
    .linkbtn:hover{border-color:rgba(122,162,255,.65)}
    footer{
      margin-top:14px;
      color:rgba(169,180,223,.75);
      font-size:12px;
      line-height:1.6;
      text-align:center;
    }
    .empty{
      padding:20px 14px;
      color:var(--muted);
      font-size:13px;
    }
    .tiny{font-size:11px; color:rgba(169,180,223,.75)}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace}
    .sep{opacity:.65}
    .intro{
      margin-top:8px;
      font-size:12px;
      color:rgba(169,180,223,.9);
      line-height:1.6;
    }
    @media (max-width: 720px){
      .controls{grid-template-columns: 1fr;}
      .card{flex-direction:column;}
      .badgeCol{min-width:auto; flex-direction:row; flex-wrap:wrap;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <h1>CSIRT 日次レポート</h1>
        <div class="subtitle">
          対象期間：<span id="window"></span><span class="sep">｜</span>
          生成：<span id="generated"></span>
        </div>
        <div class="intro">
          日次で収集したセキュリティ関連の公開情報を一覧化しています。詳細は各Web記事で確認してください。
        </div>
        <div class="metaRow">
          <span class="chip">総件数 <strong id="total">-</strong></span>
          <span class="chip">表示中 <strong id="shown">-</strong></span>
          <span class="chip">並び <strong id="sortLabel">Impact→新着</strong></span>
        </div>
      </div>
      <div class="metaRow" style="justify-content:flex-end">
        <span class="chip">ソース：<strong class="mono">manifest.json</strong></span>
      </div>
    </header>

    <div class="panel">
      <div class="controls">
        <div class="ctrl" style="grid-column: span 2;">
          <label for="q" class="labelRow">
            <span>検索（タイトル / ソース / 種別）</span>
            <span class="help" data-tip="タイトル、ソース名、種別（Threat/Impact）を横断検索します。キーワードは部分一致。"></span>
          </label>
          <input id="q" type="search" placeholder="例: CVE, Microsoft, ransomware, zero-day ..." />
        </div>

        <div class="ctrl">
          <label for="impact" class="labelRow">
            <span>Impact（AI）</span>
            <span class="help" data-tip="AI推定の影響度で絞り込みます。重大度と必ずしも一致しません。"></span>
          </label>
          <select id="impact">
            <option value="">すべて</option>
            <option>Critical</option><option>High</option><option>Medium</option><option>Low</option><option>Info</option>
          </select>
        </div>

        <div class="ctrl">
          <label for="category" class="labelRow">
            <span>カテゴリ</span>
            <span class="help" data-tip="情報源のカテゴリで絞り込みます。将来の分類拡張に備えた枠です。"></span>
          </label>
          <select id="category">
            <option value="">すべて</option>
            <option value="reporting">reporting</option>
          </select>
        </div>

        <div class="ctrl">
          <label for="sort" class="labelRow">
            <span>並び替え</span>
            <span class="help" data-tip="Impact/新着順/タイトルで並び替えます。"></span>
          </label>
          <select id="sort">
            <option value="impact_then_time">Impact→新着</option>
            <option value="time_desc">新着</option>
            <option value="time_asc">古い順</option>
            <option value="title_asc">タイトル(A→Z)</option>
          </select>
        </div>
      </div>

      <div class="summaryBar">
        <div>
          <span class="tiny">Tip:</span> 重大度は <span class="mono">Impact</span>（AI）で表示しています。
        </div>
        <div class="right">
          <button class="btn" id="reset">条件リセット</button>
          <button class="btn" id="copyLink">このページURLをコピー</button>
        </div>
      </div>

      <div id="list" class="list"></div>
      <div id="empty" class="empty" style="display:none;">条件に一致する記事がありません。</div>
    </div>

    <footer>
      <div>本ページは自動生成された日次レポートです。最終判断は原文の確認を推奨します。</div>
      <div class="tiny">notifyhub.site</div>
    </footer>
  </div>

  <script>
    // ---- Utilities
    const qs = (id) => document.getElementById(id);
    const escapeHtml = (s) => (s ?? "").replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
    const toJstLabel = (iso) => {
      if(!iso) return "-";
      try{
        const d = new Date(iso);
        // show JST explicitly
        return new Intl.DateTimeFormat("ja-JP", {
          timeZone:"Asia/Tokyo", year:"numeric", month:"2-digit", day:"2-digit",
          hour:"2-digit", minute:"2-digit"
        }).format(d) + " JST";
      }catch{ return iso; }
    };

    // ---- Severity ranking
    const impactRank = { "Critical":0, "High":1, "Medium":2, "Low":3, "Info":4, "Unknown":5, "":5, null:5, undefined:5 };

    // ---- State
    let manifest = null;
    let allItems = [];

    function render(items){
      const list = qs("list");
      list.innerHTML = "";
      qs("shown").textContent = String(items.length);

      if(items.length === 0){
        qs("empty").style.display = "block";
        return;
      }
      qs("empty").style.display = "none";

      for(const it of items){
        const entryId = it.entry_id;
        const title = it.title ?? "(no title)";
        const src = it.source_name ?? "-";
        const pub = toJstLabel(it.published_at);
        const impact = it.impact_level ?? "Unknown";
        const threat = it.threat_type ?? "-";
        const summary = it.summary_preview ?? "";
        const detailHref = it.article_path ?? ("articles/" + entryId + ".html");
        const originalHref = it.original_url ?? "#";

        const card = document.createElement("div");
        card.className = "card";

        const badgeCol = document.createElement("div");
        badgeCol.className = "badgeCol";
        badgeCol.innerHTML = `
          <div class="tagRow">
            <span class="tag level-${escapeHtml(impact)}">Impact: ${escapeHtml(impact)}</span>
          </div>
          <div class="tagRow">
            <span class="tag">${escapeHtml(threat)}</span>
          </div>
        `;

        const content = document.createElement("div");
        content.className = "content";
        content.innerHTML = `
          <h3><a href="${escapeHtml(detailHref)}">🧾 ${escapeHtml(title)}</a></h3>
          <div class="meta">
            <span>🗞️ ${escapeHtml(src)}</span>
            <span>🕒 ${escapeHtml(pub)}</span>
          </div>
          ${summary ? `<div class="summary">${escapeHtml(summary)}</div>` : ""}
          <div class="actions">
            <a class="linkbtn" href="${escapeHtml(detailHref)}">詳細を見る</a>
            <a class="linkbtn" href="${escapeHtml(originalHref)}" target="_blank" rel="noopener noreferrer">原文を開く</a>
          </div>
        `;

        card.appendChild(badgeCol);
        card.appendChild(content);
        list.appendChild(card);
      }
    }

    function applyFilters(){
      const q = qs("q").value.trim().toLowerCase();
      const impact = qs("impact").value;
      const category = qs("category").value;
      const sort = qs("sort").value;

      let items = allItems.slice();

      if(q){
        items = items.filter(it => {
          const hay = [
            it.title, it.source_name, it.threat_type, it.impact_level
          ].filter(Boolean).join(" ").toLowerCase();
          return hay.includes(q);
        });
      }
      if(impact){
        items = items.filter(it => (it.impact_level ?? "Unknown") === impact);
      }
      if(category){
        items = items.filter(it => (it.category ?? "") === category);
      }

      // Sorting
      const byTimeDesc = (a,b) => new Date(b.published_at||0) - new Date(a.published_at||0);
      const byTimeAsc  = (a,b) => new Date(a.published_at||0) - new Date(b.published_at||0);

      if(sort === "impact_then_time"){
        items.sort((a,b) => {
          const ia = impactRank[a.impact_level] ?? 5;
          const ib = impactRank[b.impact_level] ?? 5;
          if(ia !== ib) return ia - ib;
          return byTimeDesc(a,b);
        });
        qs("sortLabel").textContent = "Impact→新着";
      }else if(sort === "time_desc"){
        items.sort(byTimeDesc);
        qs("sortLabel").textContent = "新着";
      }else if(sort === "time_asc"){
        items.sort(byTimeAsc);
        qs("sortLabel").textContent = "古い順";
      }else if(sort === "title_asc"){
        items.sort((a,b) => String(a.title||"").localeCompare(String(b.title||""), "ja"));
        qs("sortLabel").textContent = "タイトル";
      }

      render(items);
    }

    async function main(){
      try{
        const res = await fetch("manifest.json", { cache: "no-store" });
        if(!res.ok) throw new Error("manifest.json fetch failed: " + res.status);
        manifest = await res.json();

        allItems = (manifest.items ?? []).map(x => ({
          ...x,
          // normalize defaults
          category: x.category ?? "reporting",
          impact_level: x.impact_level ?? "Unknown"
        }));

        qs("total").textContent = String(allItems.length);

        const w = manifest.window || {};
        const from = w.from ? toJstLabel(w.from) : "-";
        const to = w.to ? toJstLabel(w.to) : "-";
        qs("window").textContent = `${from} 〜 ${to}`;
        qs("generated").textContent = manifest.generated_at_jst ? toJstLabel(manifest.generated_at_jst) : "-";
        // Hook events
        ["q","impact","category","sort"].forEach(id => {
          qs(id).addEventListener("input", applyFilters);
          qs(id).addEventListener("change", applyFilters);
        });

        qs("reset").addEventListener("click", () => {
          qs("q").value = "";
          qs("impact").value = "";
          qs("category").value = "";
          qs("sort").value = "impact_then_time";
        applyFilters();
        });

        qs("copyLink").addEventListener("click", async () => {
          try{
            await navigator.clipboard.writeText(location.href);
            qs("copyLink").textContent = "コピーしました";
            setTimeout(() => qs("copyLink").textContent = "このページURLをコピー", 1200);
          }catch{
            alert("コピーに失敗しました。URLを手動でコピーしてください。");
          }
        });

        applyFilters();
      }catch(e){
        console.error(e);
        qs("window").textContent = "manifest.json 読み込み失敗";
        qs("generated").textContent = "-";
        qs("total").textContent = "-";
        qs("shown").textContent = "-";
        qs("list").innerHTML = `<div class="empty">manifest.json を読み込めませんでした。デプロイ状態を確認してください。</div>`;
      }
    }
    main();
  </script>
</body>
</html>
