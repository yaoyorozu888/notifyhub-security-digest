<!-- index.html  (例: /digest/YYYY-MM-DD/index.html) -->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>NotifyHub Cybersecurity Daily Report</title>
  <style>
    :root{
      --bg:#0f1218; --panel:#151b24; --panel2:#1b2330;
      --text:#eaf0f7; --muted:#a4b0c0; --line:#2a3547;
      --accent:#2bb3ff; --accent2:#ff9f1c; --good:#22c55e; --warn:#f59e0b; --bad:#ef4444; --info:#38bdf8;
      --chip:#202b3a; --shadow:0 16px 32px rgba(4,9,20,.45);
      --radius:18px;
      color-scheme: dark;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background:
        radial-gradient(900px 600px at 15% -10%, rgba(43,179,255,.18), transparent 60%),
        radial-gradient(800px 520px at 85% 0%, rgba(255,159,28,.18), transparent 55%),
        linear-gradient(180deg, #0f1218 0%, #0c1117 100%);
      color:var(--text);
    }
    a{color:var(--accent); text-decoration:none}
    a:hover{color:#6fd1ff}
    .wrap{max-width:1100px; margin:0 auto; padding:28px 18px 42px}
    header{
      display:flex; gap:16px; align-items:flex-start; justify-content:space-between;
      flex-wrap:wrap;
      margin-bottom:18px;
    }
    .title{
      display:flex; flex-direction:column; gap:6px;
      flex:1 1 520px;
      min-width:0;
    }
    .title h1{
      margin:0; font-size:22px; letter-spacing:.2px;
    }
    .subtitle{
      color:var(--muted); font-size:13px; line-height:1.5;
    }
    .metaRow{
      display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;
    }
    .headerMeta{
      flex:0 0 auto;
      justify-content:flex-end;
    }
    .impactSummary{
      display:flex; gap:8px; flex-wrap:wrap;
      margin-top:8px;
    }
    .tag.zero{opacity:.45}
    .chip{
      display:inline-flex; align-items:center; gap:8px;
      background:linear-gradient(180deg, rgba(32,43,58,.95), rgba(20,28,40,.95));
      border:1px solid rgba(42,53,71,.9);
      padding:7px 10px; border-radius:999px;
      font-size:12px; color:var(--muted);
      backdrop-filter: blur(10px);
    }
    .chip strong{color:var(--text); font-weight:650}
    .panel{
      background: linear-gradient(180deg, rgba(21,27,36,.92), rgba(14,19,27,.88));
      border:1px solid rgba(42,53,71,.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:visible;
    }
    .controls{
      display:grid;
      grid-template-columns: 1.4fr 0.6fr 0.6fr 0.6fr;
      gap:10px;
      padding:14px;
      background:rgba(27,35,48,.7);
      border-bottom:1px solid rgba(42,53,71,.9);
      overflow:visible;
    }
    @media (max-width: 980px){
      .controls{grid-template-columns: 1fr 1fr; }
    }
    .ctrl{
      display:flex; flex-direction:column; gap:6px;
      min-width:0;
    }
    .ctrl label{font-size:11px; color:var(--muted)}
    .labelRow{display:flex; align-items:center; justify-content:space-between; gap:6px}
    .help{
      position:relative;
      width:14px; height:14px;
      border-radius:50%;
      border:1px solid rgba(164,176,192,.6);
      color:rgba(164,176,192,.95);
      font-size:10px; line-height:12px;
      text-align:center;
      cursor:help;
      flex:0 0 auto;
      background:rgba(15,18,24,.6);
    }
    .help::after{content:"?";}
    .help::before{
      content:attr(data-tip);
      position:absolute;
      right:0;
      top:-8px;
      transform:translateY(-100%);
      background:#0f141c;
      color:#eaf0f7;
      border:1px solid rgba(42,53,71,.9);
      border-radius:10px;
      padding:8px 10px;
      width:220px;
      max-width:260px;
      font-size:11px;
      line-height:1.5;
      opacity:0;
      pointer-events:none;
      box-shadow: var(--shadow);
      z-index:10;
    }
    .help:hover::before{opacity:1;}
    input[type="search"], select{
      width:100%;
      padding:10px 11px;
      border-radius:12px;
      border:1px solid rgba(42,53,71,.9);
      background:rgba(15,20,28,.85);
      color:var(--text);
      outline:none;
    }
    input[type="search"]::placeholder{color:rgba(164,176,192,.75)}
    input[type="search"]:focus, select:focus{border-color:rgba(43,179,255,.8)}
    .summaryBar{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 14px;
      border-bottom:1px solid rgba(42,53,71,.9);
      color:var(--muted);
      font-size:12px;
      background:rgba(16,22,30,.7);
    }
    .summaryBar .right{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }
    .btn{
      appearance:none; border:1px solid rgba(42,53,71,.9);
      background:rgba(15,20,28,.8);
      color:var(--text);
      padding:8px 10px;
      border-radius:12px;
      font-size:12px;
      cursor:pointer;
    }
    .btn:hover{border-color:rgba(43,179,255,.65)}
    .list{
      padding:12px;
      display:flex; flex-direction:column; gap:10px;
    }
    .card{
      position:relative;
      background: linear-gradient(180deg, rgba(24,32,44,.9), rgba(18,24,34,.85));
      border:1px solid rgba(42,53,71,.9);
      border-radius:16px;
      padding:12px 12px 10px 14px;
      display:flex; gap:12px;
      align-items:flex-start;
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute;
      left:0; top:0; bottom:0;
      width:4px;
      background:linear-gradient(180deg, rgba(43,179,255,.9), rgba(43,179,255,.4));
      opacity:.75;
    }
    .card.impact-Critical::before{background:linear-gradient(180deg, #ff7a8a, #ef4444)}
    .card.impact-High::before{background:linear-gradient(180deg, #ffbf47, #f59e0b)}
    .card.impact-Medium::before{background:linear-gradient(180deg, #6fd1ff, #2bb3ff)}
    .card.impact-Low::before{background:linear-gradient(180deg, #6ee7a8, #22c55e)}
    .card.impact-Info::before{background:linear-gradient(180deg, #93c5fd, #38bdf8)}
    .card.impact-Unknown::before{background:linear-gradient(180deg, #94a3b8, #64748b)}
    .badgeCol{
      min-width:122px;
      display:flex;
      flex-direction:column;
      gap:8px;
      padding-top:2px;
    }
    .tagRow{display:flex; gap:8px; flex-wrap:wrap}
    .tag{
      font-size:11px;
      padding:6px 9px;
      border-radius:999px;
      background:rgba(32,43,58,.85);
      border:1px solid rgba(42,53,71,.9);
      color:var(--muted);
      white-space:nowrap;
    }
    .tag.level-Critical{border-color:rgba(239,68,68,.7); background:rgba(239,68,68,.18); color:#ffd0d7}
    .tag.level-High{border-color:rgba(245,158,11,.7); background:rgba(245,158,11,.18); color:#ffe6b3}
    .tag.level-Medium{border-color:rgba(43,179,255,.7); background:rgba(43,179,255,.18); color:#d9f0ff}
    .tag.level-Low{border-color:rgba(34,197,94,.6); background:rgba(34,197,94,.16); color:#d3ffe6}
    .tag.level-Info{border-color:rgba(56,189,248,.6); background:rgba(56,189,248,.16); color:#d6f2ff}
    .content{min-width:0; flex:1}
    .content h3{
      margin:0;
      font-size:15px;
      line-height:1.35;
      letter-spacing:.15px;
    }
    .content h3 a{color:var(--text)}
    .content h3 a:hover{color:var(--accent)}
    .meta{
      margin-top:6px;
      display:flex; gap:10px; flex-wrap:wrap;
      color:var(--muted);
      font-size:12px;
    }
    .meta span{
      padding:2px 6px;
      border-radius:8px;
      background:rgba(20,28,40,.7);
      border:1px solid rgba(42,53,71,.6);
    }
    .summary{
      margin-top:8px;
      color:rgba(231,236,255,.95);
      font-size:12px;
      line-height:1.7;
      background:rgba(20,28,40,.8);
      border:1px solid rgba(42,53,71,.75);
      border-left:3px solid rgba(43,179,255,.7);
      border-radius:12px;
      padding:8px 10px;
    }
    .meta a{color:var(--muted)}
    .meta a:hover{color:var(--accent)}
    .actions{
      margin-top:10px;
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .linkbtn{
      text-decoration:none;
      display:inline-flex; align-items:center; justify-content:center;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(42,53,71,.9);
      background:rgba(15,20,28,.85);
      font-size:12px;
      color:var(--text);
    }
    .linkbtn:hover{border-color:rgba(43,179,255,.65)}
    footer{
      margin-top:14px;
      color:rgba(164,176,192,.8);
      font-size:12px;
      line-height:1.6;
      text-align:center;
    }
    .empty{
      padding:20px 14px;
      color:var(--muted);
      font-size:13px;
    }
    .tiny{font-size:11px; color:rgba(164,176,192,.8)}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace}
    .sep{opacity:.65}
    .intro{
      margin-top:8px;
      font-size:12px;
      color:rgba(164,176,192,.95);
      line-height:1.6;
    }
    @media (max-width: 720px){
      header{flex-direction:column; align-items:stretch; justify-content:flex-start}
      .title{flex:0 0 auto}
      .headerMeta{justify-content:flex-start; margin-top:0}
      .controls{grid-template-columns: 1fr;}
      .card{flex-direction:column;}
      .badgeCol{min-width:auto; flex-direction:row; flex-wrap:wrap;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <h1>NotifyHub Cybersecurity Daily Report</h1>
        <div class="subtitle">
          対象期間：<span id="window"></span><span class="sep">｜</span>
          生成：<span id="generated"></span>
        </div>
        <div class="intro">
          日次で収集したセキュリティ関連の公開情報を一覧化しています。詳細は各Web記事で確認してください。
        </div>
        <div class="impactSummary" id="impactSummary"></div>
        <div class="metaRow">
          <span class="chip">総件数 <strong id="total">-</strong></span>
          <span class="chip">表示中 <strong id="shown">-</strong></span>
          <span class="chip">並び <strong id="sortLabel">Impact→新着</strong></span>
        </div>
      </div>
      <div class="metaRow headerMeta">
        <span class="chip">ソース：<strong class="mono">manifest.json</strong></span>
      </div>
    </header>

    <div class="panel">
      <div class="controls">
        <div class="ctrl" style="grid-column: span 2;">
          <label for="q" class="labelRow">
            <span>検索（タイトル / ソース / 種別）</span>
            <span class="help" data-tip="タイトル、ソース名、種別（Threat/Impact）を横断検索します。キーワードは部分一致。"></span>
          </label>
          <input id="q" type="search" placeholder="例: CVE, Microsoft, ransomware, zero-day ..." />
        </div>

        <div class="ctrl">
          <label for="impact" class="labelRow">
            <span>Impact（AI）</span>
            <span class="help" data-tip="AI推定の影響度で絞り込みます。重大度と必ずしも一致しません。"></span>
          </label>
          <select id="impact">
            <option value="">すべて</option>
            <option>Critical</option><option>High</option><option>Medium</option><option>Low</option><option>Info</option>
          </select>
        </div>

        <div class="ctrl">
          <label for="threat_type" class="labelRow">
            <span>種別</span>
            <span class="help" data-tip="AI推定の種別（threat_type）で絞り込みます。"></span>
          </label>
          <select id="threat_type">
            <option value="">すべて</option>
          </select>
        </div>

        <div class="ctrl">
          <label for="sort" class="labelRow">
            <span>並び替え</span>
            <span class="help" data-tip="Impact/新着順/タイトルで並び替えます。"></span>
          </label>
          <select id="sort">
            <option value="impact_then_time">Impact→新着</option>
            <option value="time_desc">新着</option>
            <option value="time_asc">古い順</option>
            <option value="title_asc">タイトル(A→Z)</option>
          </select>
        </div>
      </div>

      <div class="summaryBar">
        <div>
          <span class="tiny">Tip:</span> 重大度は <span class="mono">Impact</span>（AI）で表示しています。
        </div>
        <div class="right">
          <button class="btn" id="reset">条件リセット</button>
          <button class="btn" id="copyLink">このページURLをコピー</button>
        </div>
      </div>

      <div id="list" class="list"></div>
      <div id="empty" class="empty" style="display:none;">条件に一致する記事がありません。</div>
    </div>

    <footer>
      <div>本ページは自動生成された日次レポートです。最終判断は原文の確認を推奨します。</div>
      <div class="tiny">notifyhub.site</div>
    </footer>
  </div>

  <script>
    // ---- Utilities
    const qs = (id) => document.getElementById(id);
    const escapeHtml = (s) => (s ?? "").replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
    const toJstLabel = (iso) => {
      if(!iso) return "-";
      try{
        const d = new Date(iso);
        // show JST explicitly
        return new Intl.DateTimeFormat("ja-JP", {
          timeZone:"Asia/Tokyo", year:"numeric", month:"2-digit", day:"2-digit",
          hour:"2-digit", minute:"2-digit"
        }).format(d) + " JST";
      }catch{ return iso; }
    };

    // ---- Severity ranking
    const impactRank = { "Critical":0, "High":1, "Medium":2, "Low":3, "Info":4, "Unknown":5, "":5, null:5, undefined:5 };

    // ---- State
    let manifest = null;
    let allItems = [];

    function populateThreatTypeOptions(items){
      const threatOrder = [
        "Vulnerability",
        "Exploit",
        "Zero-day",
        "Vulnerability Disclosure",
        "Patch",
        "Misconfiguration",
        "Malware",
        "Ransomware",
        "Botnet",
        "Cryptojacking",
        "Phishing",
        "Business Email Compromise",
        "Scam/Fraud",
        "Credential Theft",
        "Intrusion",
        "Data Breach",
        "DDoS",
        "Supply Chain",
        "Advisory",
        "Other",
        "Unknown",
      ];

      const uniq = new Set();
      for(const it of items){
        uniq.add(it?.threat_type ?? "Unknown");
      }

      const values = Array.from(uniq);
      values.sort((a,b) => {
        const ia = threatOrder.indexOf(a);
        const ib = threatOrder.indexOf(b);
        if(ia === -1 && ib === -1) return String(a).localeCompare(String(b), "ja");
        if(ia === -1) return 1;
        if(ib === -1) return -1;
        return ia - ib;
      });

      const sel = qs("threat_type");
      sel.innerHTML = "";

      const optAll = document.createElement("option");
      optAll.value = "";
      optAll.textContent = "すべて";
      sel.appendChild(optAll);

      for(const v of values){
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        sel.appendChild(opt);
      }
    }

    function render(items){
      const list = qs("list");
      list.innerHTML = "";
      qs("shown").textContent = String(items.length);

      if(items.length === 0){
        qs("empty").style.display = "block";
        return;
      }
      qs("empty").style.display = "none";

      for(const it of items){
        const entryId = it.entry_id;
        const title = it.title ?? "(no title)";
        const src = it.source_name ?? "-";
        const pub = toJstLabel(it.published_at);
        const impact = it.impact_level ?? "Unknown";
        const threat = it.threat_type ?? "Unknown";
        const summary = it.summary_preview ?? "";
        const detailHref = it.article_path ?? ("articles/" + entryId + ".html");
        const originalHref = it.original_url ?? "#";

        const card = document.createElement("div");
        const impactClass = String(impact || "Unknown").replace(/[^a-zA-Z0-9_-]/g, "");
        card.className = "card impact-" + impactClass;

        const badgeCol = document.createElement("div");
        badgeCol.className = "badgeCol";
        badgeCol.innerHTML = `
          <div class="tagRow">
            <span class="tag level-${escapeHtml(impact)}">Impact: ${escapeHtml(impact)}</span>
          </div>
          <div class="tagRow">
            <span class="tag">${escapeHtml(threat)}</span>
          </div>
        `;

        const content = document.createElement("div");
        content.className = "content";
        content.innerHTML = `
          <h3><a href="${escapeHtml(detailHref)}">🧾 ${escapeHtml(title)}</a></h3>
          <div class="meta">
            <span>🗞️ ${escapeHtml(src)}</span>
            <span>🕒 ${escapeHtml(pub)}</span>
          </div>
          ${summary ? `<div class="summary">${escapeHtml(summary)}</div>` : ""}
          <div class="actions">
            <a class="linkbtn" href="${escapeHtml(detailHref)}">詳細を見る</a>
            <a class="linkbtn" href="${escapeHtml(originalHref)}" target="_blank" rel="noopener noreferrer">原文を開く</a>
          </div>
        `;

        card.appendChild(badgeCol);
        card.appendChild(content);
        list.appendChild(card);
      }
    }

    function applyFilters(){
      const q = qs("q").value.trim().toLowerCase();
      const impact = qs("impact").value;
      const threatType = qs("threat_type").value;
      const sort = qs("sort").value;

      let items = allItems.slice();

      if(q){
        items = items.filter(it => {
          const hay = [
            it.title, it.source_name, it.threat_type, it.impact_level
          ].filter(Boolean).join(" ").toLowerCase();
          return hay.includes(q);
        });
      }
      if(impact){
        items = items.filter(it => (it.impact_level ?? "Unknown") === impact);
      }
      if(threatType){
        items = items.filter(it => (it.threat_type ?? "Unknown") === threatType);
      }

      // Sorting
      const byTimeDesc = (a,b) => new Date(b.published_at||0) - new Date(a.published_at||0);
      const byTimeAsc  = (a,b) => new Date(a.published_at||0) - new Date(b.published_at||0);

      if(sort === "impact_then_time"){
        items.sort((a,b) => {
          const ia = impactRank[a.impact_level] ?? 5;
          const ib = impactRank[b.impact_level] ?? 5;
          if(ia !== ib) return ia - ib;
          return byTimeDesc(a,b);
        });
        qs("sortLabel").textContent = "Impact→新着";
      }else if(sort === "time_desc"){
        items.sort(byTimeDesc);
        qs("sortLabel").textContent = "新着";
      }else if(sort === "time_asc"){
        items.sort(byTimeAsc);
        qs("sortLabel").textContent = "古い順";
      }else if(sort === "title_asc"){
        items.sort((a,b) => String(a.title||"").localeCompare(String(b.title||""), "ja"));
        qs("sortLabel").textContent = "タイトル";
      }

      render(items);
    }

    async function main(){
      try{
        const res = await fetch("manifest.json", { cache: "no-store" });
        if(!res.ok) throw new Error("manifest.json fetch failed: " + res.status);
        manifest = await res.json();

        allItems = (manifest.items ?? []).map(x => ({
          ...x,
          // normalize defaults
          impact_level: x.impact_level ?? "Unknown",
          threat_type: x.threat_type ?? "Unknown",
        }));

        qs("total").textContent = String(allItems.length);
        populateThreatTypeOptions(allItems);

        // Impact summary (counts by impact_level)
        const impactOrder = ["Critical","High","Medium","Low","Info","Unknown"];
        const counts = Object.fromEntries(impactOrder.map(k => [k, 0]));
        for(const it of allItems){
          const k = impactOrder.includes(it.impact_level) ? it.impact_level : "Unknown";
          counts[k] = (counts[k] ?? 0) + 1;
        }
        const summary = qs("impactSummary");
        if(summary){
          summary.innerHTML = impactOrder.map(k => {
            const n = counts[k] ?? 0;
            const zero = n === 0 ? " zero" : "";
            return `<span class="tag level-${escapeHtml(k)}${zero}">${escapeHtml(k)} <strong>${n}</strong></span>`;
          }).join("");
        }

        const w = manifest.window || {};
        const from = w.from ? toJstLabel(w.from) : "-";
        const to = w.to ? toJstLabel(w.to) : "-";
        qs("window").textContent = `${from} 〜 ${to}`;
        qs("generated").textContent = manifest.generated_at_jst ? toJstLabel(manifest.generated_at_jst) : "-";
        // Hook events
        ["q","impact","threat_type","sort"].forEach(id => {
          qs(id).addEventListener("input", applyFilters);
          qs(id).addEventListener("change", applyFilters);
        });

        qs("reset").addEventListener("click", () => {
          qs("q").value = "";
          qs("impact").value = "";
          qs("threat_type").value = "";
          qs("sort").value = "impact_then_time";
        applyFilters();
        });

        qs("copyLink").addEventListener("click", async () => {
          try{
            await navigator.clipboard.writeText(location.href);
            qs("copyLink").textContent = "コピーしました";
            setTimeout(() => qs("copyLink").textContent = "このページURLをコピー", 1200);
          }catch{
            alert("コピーに失敗しました。URLを手動でコピーしてください。");
          }
        });

        applyFilters();
      }catch(e){
        console.error(e);
        qs("window").textContent = "manifest.json 読み込み失敗";
        qs("generated").textContent = "-";
        qs("total").textContent = "-";
        qs("shown").textContent = "-";
        qs("list").innerHTML = `<div class="empty">manifest.json を読み込めませんでした。デプロイ状態を確認してください。</div>`;
      }
    }
    main();
  </script>
</body>
</html>
